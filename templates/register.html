<!DOCTYPE html>
<html>
<head>
    <title>Register - Forensic System</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .register-card {
            background: rgba(255,255,255,0.98);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        .register-header {
            background: linear-gradient(135deg, #27ae60, #2ecc71);
            padding: 30px;
            text-align: center;
        }
        .register-header h4 {
            color: white;
            margin: 0;
            font-weight: bold;
        }
        .register-header i {
            font-size: 3rem;
            color: white;
            margin-bottom: 10px;
        }
        .form-control {
            border-radius: 10px;
            padding: 12px;
            border: 2px solid #e0e0e0;
        }
        .form-control:focus {
            border-color: #27ae60;
            box-shadow: 0 0 10px rgba(39,174,96,0.2);
        }
        .btn-register {
            background: linear-gradient(135deg, #27ae60, #2ecc71);
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-weight: bold;
        }
        .btn-register:hover {
            background: linear-gradient(135deg, #2ecc71, #27ae60);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="register-card">
                    <div class="register-header">
                        <i class="fas fa-user-plus"></i>
                        <h4>Create New Account</h4>
                    </div>
                    <div class="card-body p-4">
                        {% with messages = get_flashed_messages(with_categories=true) %}
                            {% if messages %}
                                {% for category, message in messages %}
                                    <div class="alert alert-{{ category }}">{{ message }}</div>
                                {% endfor %}
                            {% endif %}
                        {% endwith %}
                        
                        <form method="POST">
                            <div class="mb-3">
                                <label><i class="fas fa-user"></i> Username</label>
                                <input type="text" name="username" class="form-control" placeholder="Choose username" required>
                            </div>
                            <div class="mb-3">
                                <label><i class="fas fa-lock"></i> Password</label>
                                <input type="password" name="password" class="form-control" placeholder="Choose password" required>
                            </div>
                            <div class="mb-3">
                                <label><i class="fas fa-user-tag"></i> Account Type</label>
                                <select name="role" class="form-control">
                                    <option value="user">User (View Only)</option>
                                    <option value="admin">Admin (Full Access)</option>
                                </select>
                            </div>
                            <button type="submit" class="btn btn-success btn-register w-100 text-white">
                                <i class="fas fa-save"></i> Register
                            </button>
                        </form>
                        <div class="text-center mt-3">
                            <a href="/login" style="color: #27ae60;"><i class="fas fa-sign-in-alt"></i> Already have account? Login</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
