{% extends 'base.html' %}
{% block content %}
<h2 class="page-title"><i class="fas fa-plus-circle"></i> Add New Crime</h2>

<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card">
            <div class="card-header">
                <i class="fas fa-clipboard-list"></i> Crime Information
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label><i class="fas fa-hashtag"></i> Case ID</label>
                            <input type="text" name="case_id" class="form-control" placeholder="CR001" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label><i class="fas fa-exclamation-triangle"></i> Crime Type</label>
                            <select name="crime_type" class="form-control">
                                <option>Theft</option>
                                <option>Murder</option>
                                <option>Robbery</option>
                                <option>Assault</option>
                                <option>Fraud</option>
                            </select>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label><i class="fas fa-map-marker-alt"></i> Location</label>
                            <select name="location" class="form-control">
                                <option>Downtown</option>
                                <option>Suburbs</option>
                                <option>Industrial Zone</option>
                                <option>Park</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label><i class="fas fa-calendar"></i> Date</label>
                            <input type="date" name="date" class="form-control" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label><i class="fas fa-clock"></i> Time Slot</label>
                        <select name="time_slot" class="form-control">
                            <option>Morning</option>
                            <option>Afternoon</option>
                            <option>Evening</option>
                            <option>Night</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label><i class="fas fa-search"></i> Modus Operandi</label>
                        <textarea name="modus_operandi" class="form-control" rows="3" placeholder="Describe the method used..."></textarea>
                    </div>
                    <div class="mb-3">
                        <label><i class="fas fa-user-secret"></i> Link Suspects (Hold Ctrl to select multiple)</label>
                        <select name="suspects" class="form-control" multiple style="height: 100px;">
                            {% for suspect in suspects %}
                            <option value="{{ suspect.id }}">{{ suspect.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="text-center">
                        <button type="submit" class="btn btn-primary btn-custom">
                            <i class="fas fa-save"></i> Add Crime Record
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
